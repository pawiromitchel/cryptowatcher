name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-run only the Homebrew formula update for an existing release (e.g. after a failure).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose binaries the formula should point at (e.g. v1.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Cross-Platform Binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            output: cryptowatcher-darwin-arm64
          - os: darwin
            arch: amd64
            output: cryptowatcher-darwin-amd64
          - os: linux
            arch: amd64
            output: cryptowatcher-linux-amd64
          - os: linux
            arch: arm64
            output: cryptowatcher-linux-arm64
          - os: windows
            arch: amd64
            output: cryptowatcher-windows-amd64.exe

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Tests
        run: go test -race -count=1 ./...

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/${{ matrix.output }} ./cmd/cryptowatcher

      - name: Package Artifact
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip ${{ matrix.output }}.zip ${{ matrix.output }}
          else
            tar -czf ${{ matrix.output }}.tar.gz ${{ matrix.output }}
          fi

      - name: Upload Build Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true

  formula:
    name: Update Homebrew formula
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute checksums of the released binaries
        id: sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets --pattern '*.tar.gz'
          for t in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            f="assets/cryptowatcher-$t.tar.gz"
            test -s "$f" || { echo "missing $f" >&2; exit 1; }
            echo "${t//-/_}=$(sha256sum "$f" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done

      - name: Commit the formula to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/update-formula.sh "${TAG#v}" \
            "${{ steps.sums.outputs.darwin_arm64 }}" "${{ steps.sums.outputs.darwin_amd64 }}" \
            "${{ steps.sums.outputs.linux_arm64 }}" "${{ steps.sums.outputs.linux_amd64 }}"
